<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Hot Potatoes: The Whole Lesson</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff7e6;--card:#fff;--ink:#2b2b2b;--acc:#7b3fa0;--ok:#2e9d4f;--bad:#e0623a;--btn:#ffe08a;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a2b;--card:#2c2640;--ink:#f5f0ff;--acc:#d4a5ff;--ok:#6ddc8c;--bad:#ff9b7a;--btn:#4a3d73;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Trebuchet MS",Arial,sans-serif;font-size:20px;text-align:center}
.w{max-width:640px;margin:0 auto;padding:14px}h1{color:var(--acc);font-size:26px;margin:8px 0}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 4px 12px #0002}
.tag{display:inline-block;background:var(--acc);color:var(--bg);border-radius:12px;padding:2px 12px;font-size:15px}
.q{font-size:24px;font-weight:bold;margin:14px 0}
.o{display:block;width:100%;margin:10px 0;padding:16px;font:inherit;font-size:22px;background:var(--btn);color:var(--ink);border:3px solid var(--acc);border-radius:18px;cursor:pointer}
.o.ok{background:var(--ok);color:#fff}.o.no{background:var(--bad);color:#fff}
.go{font-size:24px;padding:14px 30px;background:var(--acc);color:var(--bg);border:0;border-radius:30px;cursor:pointer;font-family:inherit}
.bar{height:14px;background:#0002;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.st{font-size:32px;min-height:42px}.fb{font-size:22px;min-height:34px;margin:8px 0;font-weight:bold}
</style></head><body><div class="w"><h1>🥔 Hot Potatoes: The Whole Lesson</h1><div class="card" id="c"></div></div>
<script>
const Q=[["Vocabulary", "Words like Bang! and Pop! copy a sound. What is this called?", "onomatopoeia", ["alliteration", "glossary", "a rhyme"]], ["Vocabulary", "Which word is an onomatopoeia word?", "Crash", ["Chair", "Happy", "Table"]], ["Vocabulary", "Which word is also an onomatopoeia word?", "Pop", ["Pan", "Pencil", "Plate"]], ["Vocabulary", "Which two words are on the fireworks picture?", "WHIZZ and BANG", ["PHEW and POP", "CRASH and POP", "HOP and JUMP"]], ["Spelling", "scream + ing = ?", "screaming", ["screamming", "screameing", "screamin"]], ["Spelling", "sizzle + ing = ?", "sizzling", ["sizzleing", "sizzlling", "sizling"]], ["Spelling", "thump + ing = ?", "thumping", ["thumpping", "thumpeing", "thumpin"]], ["Spelling", "dance + ing = ?", "dancing", ["danceing", "dannceing", "dancng"]], ["Spelling", "hop + ing = ?", "hopping", ["hoping", "hopeing", "hopin"]], ["Grammar", "Which rule helps us spell sizzling?", "Remove the e, then add ing", ["Just add ing", "Double the last letter", "Add s"]], ["Vocabulary", "phew means …", "an expression of relief", ["very angry", "a fast dance", "very big"]], ["Vocabulary", "seething means …", "being very angry", ["working hard", "pushing", "hopping around"]], ["Vocabulary", "Which are the tea-things?", "kettle, teapot, cups and a jug", ["fork, spoon and knife", "pan and potatoes", "hat and shoes"]], ["Vocabulary", "hustling means …", "pushing", ["frying", "a lively dance", "relief"]], ["Vocabulary", "moiling means …", "working hard", ["being in trouble", "very big", "noise in a crowd"]], ["Vocabulary", "sizzling means …", "frying and making a hissing noise", ["working hard", "feeling cross", "jump and leap"]], ["Vocabulary", "bustle means …", "noise in a crowd", ["very big", "a fast dance", "being in trouble"]], ["Vocabulary", "hoppity means …", "hopping around", ["very angry", "working hard", "relief"]], ["Vocabulary", "A polka is …", "a fast and lively dance", ["a hot pan", "a kind of potato", "a kettle"]], ["Vocabulary", "lollop means …", "jump and leap forward", ["frying", "pushing", "relief"]], ["Vocabulary", "whopping means …", "very big", ["very small", "very angry", "a lively dance"]], ["Vocabulary", "copping it means …", "being in trouble", ["being very big", "hopping around", "working hard"]], ["Vocabulary", "bristling means feeling …", "cross like an animal with its fur standing up", ["happy and calm", "very sleepy", "very hungry"]], ["Comprehension", "Who wrote the poem?", "Kirsi Kunnas", ["Edward Lear", "Atinuke", "Rex Stone"]], ["Comprehension", "What does the pan take off its head?", "Its hat", ["Its shoes", "Its coat", "Its gloves"]], ["Comprehension", "The first two verses are about …", "the pan", ["the leaves", "the wind", "a train station"]], ["Who / What", "Who shouts “Ouch”, popping up fit to split?", "The potatoes", ["The pan", "The kettle", "The fireworks"]], ["Who / What", "Which words say how the potatoes move in the last verse?", "hopping, galloping, jumping", ["sleeping, sitting, eating", "reading, writing, drawing", "boiling, steaming, sweating"]], ["Comprehension", "How can you perform the poem as the pan gets hotter?", "Talk louder or quicker, or use a higher voice", ["Whisper slowly", "Stay silent", "Sing a lullaby"]], ["Comprehension", "In Go further, which is an idea for your own poem?", "people at a busy train station", ["a quiet library", "a sleeping cat", "a cold ice cream"]], ["Who / What", "In the Challenge, if you wrote about the leaves, you write a verse about …", "the wind", ["the pan", "the potatoes", "the moon"]]],TOTAL=Q.length;let i=0,s=0,order=[];
const c=document.getElementById("c");
const sh=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function start(){i=0;s=0;order=sh(Q);c.innerHTML='<p>Hello, super reader! ⭐</p><p>Poem words, spelling, and poem questions from pages 56 to 58.</p><p>31 questions. Tap the best answer.</p><button class="go" id="b0">Let’s play!</button>';document.getElementById("b0").onclick=show}
function show(){if(i>=TOTAL)return end();const q=order[i];
c.innerHTML='<div class="bar"><i style="width:'+(i/TOTAL*100)+'%"></i></div><p><span class="tag">'+q[0]+'</span> Question '+(i+1)+' of '+TOTAL+'</p><div class="st">'+'⭐'.repeat(s>8?8:s)+'</div><div class="q"></div><div id="op"></div><div class="fb" id="fb"></div>';
c.querySelector(".q").textContent=q[1];const op=document.getElementById("op");
sh([q[2]].concat(q[3])).forEach(t=>{const b=document.createElement("button");b.className="o";b.textContent=t;b.onclick=()=>pick(b,t,q);op.appendChild(b)})}
function pick(b,t,q){const all=document.querySelectorAll(".o");all.forEach(x=>x.disabled=true);const fb=document.getElementById("fb");
if(t===q[2]){s++;b.classList.add("ok");fb.textContent=["Great job! 🌟","Well done! 🎉","Super! ⭐","Yes! Amazing! 🥔"][i%4]}
else{b.classList.add("no");all.forEach(x=>{if(x.textContent===q[2])x.classList.add("ok")});fb.textContent="Nice try! The answer is: "+q[2]}
const n=document.createElement("button");n.className="go";n.textContent=i+1<TOTAL?"Next ➜":"See my stars ⭐";n.onclick=()=>{i++;show()};c.appendChild(n)}
function end(){const r=s/TOTAL,st=r>=.9?5:r>=.75?4:r>=.55?3:r>=.35?2:1;
c.innerHTML='<h1>You scored '+s+' / '+TOTAL+'!</h1><div class="st">'+'⭐'.repeat(st)+'</div><p>'+(st>=4?"Fantastic work! 🎉":st>=3?"Good job! Keep going! 👏":"Good try! Play again! 💪")+'</p><button class="go" id="r">Play again 🔄</button>';document.getElementById("r").onclick=start}
start();
</script></body></html>
